<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
</style>
</head>
<body>
<!-- ===== UVERworld 視聴状況 埋め込みウィジェット ===== -->
<div id="uw-tracker">
  <style>
    #uw-tracker {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #1a1a1a;
      background: #fff;
      border-radius: 0;
      overflow: hidden;
      margin: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .uw-head {
      background: #212529;
      padding: 14px 16px;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .uw-head h2 {
      font-size: 1.15rem;
      color: #fff;
      letter-spacing: 2px;
      margin: 0;
      white-space: nowrap;
    }
    .uw-stats {
      display: none;
    }
    .uw-stat {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      background: #fff;
    }
    .uw-stat.total  { border: 1px solid #94a3b8; color: #64748b; }
    .uw-stat.heard  { border: 1px solid #16a34a; color: #16a34a; }
    .uw-stat.unheard{ border: 1px solid #dc2626; color: #dc2626; }

    .uw-ctrl {
      padding: 10px 16px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .uw-search {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #1a1a1a;
      font-size: 0.85rem;
      flex: 1 1 160px;
      min-width: 0;
    }
    .uw-fbtn {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      font-size: 0.78rem;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .uw-fbtn:hover { border-color: #94a3b8; color: #1a1a1a; }
    .uw-fbtn.active { background: #e94560; border-color: #e94560; color: #fff; }

    .uw-body {
      padding: 12px 12px;
      flex: 1;
      overflow-y: auto;
    }
    .uw-card {
      background: #fff;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }
    .uw-aheader {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
    }
    .uw-aheader:hover { background: #f1f5f9; }
    .uw-aname { font-size: 0.88rem; font-weight: bold; }
    .uw-adate { font-size: 0.7rem; color: #94a3b8; }
    .uw-prog {
      margin-left: auto;
      flex: 0 0 80px;
      text-align: right;
    }
    .uw-bar {
      height: 5px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
    }
    .uw-fill {
      height: 100%;
      background: #16a34a;
      border-radius: 3px;
      transition: width 0.3s;
    }
    .uw-plabel { font-size: 0.68rem; color: #94a3b8; margin-top: 2px; }
    .uw-chev { font-size: 0.75rem; color: #94a3b8; transition: transform 0.2s; margin-left: 6px; }
    .uw-card.open .uw-chev { transform: rotate(180deg); }

    .uw-tracks {
      display: none;
      padding: 4px 14px 10px;
      border-top: 1px solid #e2e8f0;
    }
    .uw-card.open .uw-tracks { display: block; }

    .uw-track {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.83rem;
    }
    .uw-track:last-child { border-bottom: none; }

    .uw-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      flex-shrink: 0;
    }
    .uw-dot.h { background: #dcfce7; color: #16a34a; }
    .uw-dot.u { background: #fee2e2; color: #dc2626; }

    .uw-ttitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .uw-ttitle.u { color: #94a3b8; }

    .uw-live {
      position: relative;
      font-size: 0.68rem;
      color: #64748b;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .uw-popup {
      display: none;
      position: absolute;
      right: 0;
      top: 18px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 10px;
      z-index: 50;
      min-width: 120px;
      font-size: 0.73rem;
      color: #475569;
      white-space: nowrap;
      max-height: 200px;
      overflow-y: auto;
    }
    .uw-live:hover .uw-popup { display: block; }

    /* レスポンシブ: スマホ */
    @media (max-width: 600px) {
      .uw-head h2 { font-size: 1rem; }
      .uw-ctrl { gap: 6px; }
      .uw-search { font-size: 0.8rem; }
      .uw-fbtn { font-size: 0.72rem; padding: 4px 9px; }
      .uw-aname { font-size: 0.82rem; }
      .uw-track { font-size: 0.78rem; }
      .uw-prog { flex: 0 0 64px; }
    }
  </style>

  <div class="uw-head">
    <h2>TRACK LIST</h2>
    <div class="uw-stats">
      <span class="uw-stat total">Total 318 Tracks</span>
      <span class="uw-stat heard">✅ Heard 228 Tracks</span>
      <span class="uw-stat unheard">❌ Unheard 90 Tracks</span>
    </div>
  </div>

  <div class="uw-ctrl">
    <input class="uw-search" id="uw-search" type="text" placeholder="🔍 Search by track or album name...">
    <button class="uw-fbtn active" onclick="uwFilter('all',this)">All</button>
    <button class="uw-fbtn" onclick="uwFilter('heard',this)">Heard</button>
    <button class="uw-fbtn" onclick="uwFilter('unheard',this)">Unheard</button>
    <button class="uw-fbtn" onclick="uwExpand(true)">Expand All</button>
    <button class="uw-fbtn" onclick="uwExpand(false)">Collapse All</button>
  </div>

  <div class="uw-body" id="uw-body"></div>
</div>

let uwFilter = 'all';
let uwSearch = '';

function uwRender() {
  const body = document.getElementById('uw-body');
  body.innerHTML = '';
  const q = uwSearch.toLowerCase();

  UW_DATA.forEach(album => {
    const tracks = album.tracks.filter(tr => {
      if (uwFilter === 'heard'   && !tr.heard) return false;
      if (uwFilter === 'unheard' &&  tr.heard) return false;
      if (q && !tr.title.toLowerCase().includes(q) && !album.album_name.toLowerCase().includes(q)) return false;
      return true;
    });
    if (!tracks.length) return;

    const pct = album.total_count > 0 ? Math.round(album.heard_count / album.total_count * 100) : 0;
    const card = document.createElement('div');
    card.className = 'uw-card';

    const tracksHtml = tracks.map(tr => {
      const live = tr.heard && tr.live_dates.length > 0
        ? `<span class="uw-live">📅 ${tr.live_dates.length}times <div class="uw-popup">${tr.live_dates.join('<br>')}</div></span>`
        : '';
      return `<div class="uw-track">
        <span class="uw-dot ${tr.heard ? 'h' : 'u'}">${tr.heard ? '✓' : '✕'}</span>
        <span class="uw-ttitle ${tr.heard ? '' : 'u'}">${tr.title}</span>
        ${live}
      </div>`;
    }).join('');

    card.innerHTML = `
      <div class="uw-aheader" onclick="this.closest('.uw-card').classList.toggle('open')">
        <div style="min-width:0;flex:1;">
          <div class="uw-aname">${album.album_name}</div>
          <div class="uw-adate">${album.release_date}</div>
        </div>
        <div class="uw-prog">
          <div class="uw-bar"><div class="uw-fill" style="width:${pct}%"></div></div>
          <div class="uw-plabel">${album.heard_count}/${album.total_count}</div>
        </div>
        <span class="uw-chev">▼</span>
      </div>
      <div class="uw-tracks">${tracksHtml}</div>`;
    body.appendChild(card);
  });
}

window.uwFilter = function(f, btn) {
  uwFilter = f;
  document.querySelectorAll('#uw-tracker .uw-fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  uwRender();
};
window.uwExpand = function(open) {
  document.querySelectorAll('#uw-tracker .uw-card').forEach(c => c.classList.toggle('open', open));
};

document.getElementById('uw-search').addEventListener('input', e => {
  uwSearch = e.target.value;
  uwRender();
  if (uwSearch) uwExpand(true);
});

uwRender();
})();
